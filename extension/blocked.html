<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockAI — проверьте VPN</title>
  <!-- Собственная нейтральная фавиконка. Без неё страница-расширение наследует
       иконку расширения (мозг/AI), и Chrome ассоциирует её с заблокированным
       доменом в истории/вкладках — из-за чего у всех блокируемых сайтов
       «подменяется» фавиконка. Явный favicon разрывает эту связь. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%231a1a2e%22%2F%3E%3Cpath%20d%3D%22M20%2030v-5a12%2012%200%200%201%2024%200v5%22%20fill%3D%22none%22%20stroke%3D%22%234a6cf7%22%20stroke-width%3D%225.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Crect%20x%3D%2214%22%20y%3D%2230%22%20width%3D%2236%22%20height%3D%2224%22%20rx%3D%226%22%20fill%3D%22%234a6cf7%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2240%22%20r%3D%223.5%22%20fill%3D%22%231a1a2e%22%2F%3E%3Crect%20x%3D%2230.25%22%20y%3D%2240%22%20width%3D%223.5%22%20height%3D%228%22%20rx%3D%221.75%22%20fill%3D%22%231a1a2e%22%2F%3E%3C%2Fsvg%3E" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8e8e8;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      text-align: center;
      padding: 48px 32px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: #b0b0b0; margin-bottom: 12px; }
    .detail { font-size: 13px; color: #888; }
    .reason { font-size: 12px; color: #666; margin-top: 8px; }
    button {
      margin-top: 24px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: #4a6cf7;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🔒</div>
    <h1 id="title">Проверьте VPN</h1>
    <p id="message">Похоже, вы забыли включить VPN. Перед началом работы убедитесь, что VPN включён и подключён к разрешённому региону.</p>
    <p class="detail" id="region" hidden></p>
    <p class="reason" id="reason" hidden></p>
    <button id="retry">Проверить снова</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
