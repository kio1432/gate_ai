<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
    }
    h1 { font-size: 14px; margin-bottom: 12px; }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.blocked { background: #fce4ec; color: #c62828; }
    .status.unknown { background: #fff3e0; color: #e65100; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .meta { color: #666; font-size: 12px; line-height: 1.5; white-space: pre-line; margin-bottom: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
    .field select,
    .field input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
    }
    .domain-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .domain-row input { flex: 1; }
    .domain-row button {
      width: auto;
      padding: 8px 12px;
      flex-shrink: 0;
    }
    .domain-list {
      list-style: none;
      margin-bottom: 8px;
      max-height: 120px;
      overflow-y: auto;
    }
    .domain-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #f5f5f7;
      border-radius: 6px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    .domain-list li span { word-break: break-all; }
    .domain-list button {
      width: auto;
      padding: 2px 8px;
      margin-left: 8px;
      background: transparent;
      color: #c62828;
      border: 1px solid #ef9a9a;
      font-size: 11px;
      flex-shrink: 0;
    }
    .hint { font-size: 11px; color: #888; line-height: 1.4; margin-bottom: 8px; }
    .empty { font-size: 12px; color: #999; margin-bottom: 8px; }
    .error { font-size: 12px; color: #c62828; margin-bottom: 8px; }
    button.primary {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #4a6cf7;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <h1>BlockAI</h1>
  <p style="font-size:11px;color:#888;margin:-8px 0 12px" id="version"></p>
  <div class="status unknown" id="status">
    <span class="dot"></span>
    <span id="label">Проверка…</span>
  </div>
  <p class="meta" id="meta"></p>
  <div class="field">
    <label for="interval">Интервал проверки</label>
    <select id="interval">
      <option value="1">1 секунда</option>
      <option value="5">5 секунд</option>
      <option value="10">10 секунд</option>
      <option value="30">30 секунд</option>
      <option value="60">1 минута</option>
      <option value="300">5 минут</option>
    </select>
  </div>
  <div class="field">
    <label>Дополнительные домены</label>
    <p class="hint">Домен целиком: example.com&nbsp;&nbsp;|&nbsp;&nbsp;Конкретный путь: example.com/path</p>
    <ul class="domain-list" id="domain-list"></ul>
    <p class="empty" id="domain-empty" hidden>Нет дополнительных доменов</p>
    <p class="error" id="domain-error" hidden></p>
    <div class="domain-row">
      <input id="domain-input" type="text" placeholder="example.com/path или https://app.example.com/id" />
      <button type="button" id="domain-add">Добавить</button>
    </div>
  </div>
  <button class="primary" id="retry">Проверить сейчас</button>
  <script src="popup.js"></script>
</body>
</html>
